<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>dsh-pet</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
</style>
</head>
<body>
<!-- 挂件有宿主自检：#root 里必须存在 composer（textarea/contenteditable），否则不初始化。
     这里放一个不可见的假 composer 满足检测；本体挂件不依赖它的可见性。 -->
<div id="root">
  <textarea aria-hidden="true" tabindex="-1"
    style="position:fixed;left:-9999px;top:-9999px;width:1px;height:1px;opacity:0;pointer-events:none;"></textarea>
</div>
<script src="/dsh-whale/widget.js"></script>
</body>
</html>
